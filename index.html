  <style>
    :root {
      --bg: #f7f6f1;
      --paper: #fdfdfb;
      --ink: #1d2433;
      --ink-2: #3a4256;
      --muted: #6b7286;
      --faint: #a2a7b5;
      --rule: #e2e0d7;
      --rule-2: #ecebe4;
      --marker: #d3edb2;
      --pink: #4b5cb3;
      --pink-2: #8197dc;
      --pink-soft: #e4eafa;
      --blue: #4b5cb3;
      --blue-soft: #e4eafa;
      --btn: #c9d6f2;
      --btn-hover: #b6c7ec;
      --navy: #27325a;
      --bar-muted: #c3c6d0;
      --display: "Space Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --serif: "Space Grotesk", ui-sans-serif, system-ui, -apple-system, sans-serif;
      --sans: "Space Grotesk", ui-sans-serif, system-ui, -apple-system, sans-serif;
      --hand: "Space Mono", ui-monospace, monospace;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --shadow-sm: 0 1px 2px rgba(24, 24, 27, .05);
      --shadow-md: 0 2px 6px rgba(29, 36, 51, .05);
      --shadow-lg: 0 4px 14px rgba(29, 36, 51, .07);
      --r-sm: 6px; --r-md: 8px; --r-lg: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--sans); background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; line-height: 1.55; overflow-x: hidden; }
    img { display: block; max-width: 100%; }
    a { color: inherit; }
    .wrap { width: calc(100% - 48px); max-width: 1120px; margin: 0 auto; }
    .prose { max-width: 700px; }
    @media (max-width: 560px) { .wrap { width: calc(100% - 32px); } }
    /* Buttons */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border-radius: 6px; font-family: var(--display); font-weight: 700; font-size: 12.5px; letter-spacing: .04em; text-transform: uppercase; text-decoration: none; cursor: pointer; border: 1px solid transparent; white-space: nowrap; transition: background .15s, border-color .15s, transform .15s; }
    .btn-primary { background: var(--btn); color: var(--ink); padding: 9px 16px; }
    .btn-primary:hover { background: var(--btn-hover); }
    .btn .ar { font-family: var(--sans); font-size: 15px; }
    .logo { display: inline-flex; align-items: center; gap: 9px; text-decoration: none; }
    .logo img { width: 28px; height: 28px; border-radius: var(--r-sm); }
    .logo-word { font-family: var(--display); font-size: 15px; font-weight: 700; letter-spacing: .01em; white-space: nowrap; text-transform: uppercase; }
    h1, h2 { font-family: var(--display); font-weight: 400; letter-spacing: -.02em; line-height: 1.12; }
    .hl { background: linear-gradient(transparent 60%, var(--marker) 60%, var(--marker) 94%, transparent 94%); padding: 0 .06em; }
    /* ---------- HERO ---------- */
    .hero { position: relative; overflow: hidden; border-bottom: 1px solid var(--rule); }
    .hero-head { text-align: center; padding: 72px 0 0; position: relative; z-index: 2; }
    @media (max-width: 760px) { .hero-head { padding-top: 48px; } }
    .hero h1 { font-size: clamp(34px, 5.4vw, 64px); letter-spacing: -.035em; line-height: 1.08; }
    .hero h1 em { font-style: normal; color: var(--pink); }
    .hero .dek { font-size: 17px; color: var(--ink-2); margin: 18px auto 0; max-width: 520px; line-height: 1.5; }
    .scene-wrap { position: relative; margin-top: -10px; }
    .scene-wrap::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 90px; background: linear-gradient(var(--bg), transparent); z-index: 1; pointer-events: none; }
    svg.iso { display: block; width: 100%; max-width: 1240px; height: auto; margin: 0 auto; overflow: visible; }
    @media (max-width: 760px) { svg.iso { width: 150%; margin-left: -22%; } }
    svg.iso .grid line { stroke: #dad8ce; stroke-width: 1; }
    svg.iso .routes path { fill: none; stroke: #8c92a6; stroke-width: 1.4; stroke-dasharray: 3 5; stroke-linecap: round; }
    svg.iso .ink polygon, svg.iso .ink path, svg.iso .ink ellipse, svg.iso .ink circle, svg.iso .ink rect { stroke: #27325a; stroke-width: 1.5; stroke-linejoin: round; }
    svg.iso .ink .nos { stroke: none; }
    svg.iso .ink line.thin, svg.iso line.thin { stroke: #27325a; stroke-width: 1; opacity: .55; }
    svg.iso .sign { font-family: var(--display); font-size: 12px; font-weight: 700; letter-spacing: .18em; fill: #27325a; }
    svg.iso .lbl { font-family: var(--display); font-size: 7px; font-weight: 700; letter-spacing: .06em; fill: #27325a; }
    svg.iso .scr { font-family: var(--mono); font-size: 10px; fill: #d6efba; }
    svg.iso .scr.dim { fill: #8b98c9; }
    svg.iso .scr.ok { fill: #b1dc88; }
    svg.iso .pawn text { font-family: var(--display); font-size: 11px; font-weight: 700; fill: #27325a; stroke: none; }
    svg.iso .pawn .say { opacity: 0; transition: opacity .25s, transform .25s; }
    svg.iso .pawn .say.on { opacity: 1; }
    svg.iso .chip rect { fill: #fff; stroke: #c9ccd8; stroke-width: 1; }
    svg.iso .chip .ic { stroke: #27325a; stroke-width: 1; }
    svg.iso .chip text { font-family: var(--sans); font-size: 10.5px; font-weight: 600; fill: #1d2433; }
    svg.iso .chip text.v { font-family: var(--mono); font-size: 9.5px; font-weight: 500; fill: #4b5cb3; }
    svg.iso .chip.tag rect { stroke: #27325a; }
    #scr-a, #scr-b { transition: width .6s cubic-bezier(.2,.8,.2,1); }
    footer { display: grid; grid-template-columns: auto 1fr; font-family: var(--display); font-size: 11.5px; letter-spacing: .02em; }
    footer .l { background: #5d6c9f; color: #fff; padding: 12px 28px; }
    footer .r { background: var(--btn); display: flex; justify-content: space-between; gap: 18px; padding: 12px 28px; flex-wrap: wrap; }
    footer a { text-decoration: none; color: var(--ink); }
    footer a:hover { text-decoration: underline; }
    footer nav { display: flex; gap: 22px; flex-wrap: wrap; }
    @media (max-width: 640px) { footer { grid-template-columns: 1fr; } footer .l, footer .r { padding: 12px 16px; } }
    /* Teaser layout */
    html, body { min-height: 100%; }
    body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 0; }
    .status { font-family: var(--mono); font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .status i { width: 7px; height: 7px; border-radius: 50%; background: #7cc04a; display: block; animation: pulse 2.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .status i { animation: none; } }
    .hero { flex: 1; border-bottom: 0; }
    footer { position: sticky; bottom: 0; z-index: 5; }
    .hero-head { padding-top: 40px; }
    @media (max-width: 760px) { .hero-head { padding-top: 28px; } }
    .cta { margin-top: 28px; }
    .cta .btn { padding: 13px 20px; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  </style>

<script>
  /* ---------- Hero scene animation ---------- */
  (function () {
    var svg = document.getElementById('iso'); if (!svg) return;
    var T = JSON.parse(document.getElementById('iso-tpl').textContent);
    var NS = 'http://www.w3.org/2000/svg';
    var layer = document.getElementById('tok-layer');
    var rIn = document.getElementById('r-in');
    var outs = { A: document.getElementById('r-a'), B: document.getElementById('r-b'), C: document.getElementById('r-c') };
    var LABEL = { A: ['Funny', '71%'], B: ['Who', '18–24'], C: ['Why', 'specific'] };
    var ICON = { A: '#c2afef', B: '#a3b7e4', C: '#b1dc88' };
    var IN_KEYS = Object.keys(T.inTpl);
    var pawns = [].slice.call(svg.querySelectorAll('.pawn .say'));
    var SAYS = ['A', 'B', 'A', 'lol', 'meh', 'A', 'ha!'];
    var SCREENS = [
      { a: 71, b: 29, who: 'who: 18–24, US', why: 'why: specific' },
      { a: 64, b: 36, who: 'who: 40+, UK', why: 'why: surprise' },
      { a: 58, b: 42, who: 'who: 25–39, India', why: 'why: relatable' }
    ];
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var movers = [], inN = 0, outN = 0, scrN = 0, visible = true, timer = null, raf = null;

    function grp(html) { var el = document.createElementNS(NS, 'g'); el.innerHTML = html; return el; }
    function chip(k) {
      var l = LABEL[k], w = 30 + l[0].length * 6.4 + l[1].length * 6 + 8;
      return '<g class="chip" transform="translate(0,-56)"><rect x="' + (-w / 2) + '" y="-11" width="' + w + '" height="22" rx="4"/>' +
        '<rect class="ic" x="' + (-w / 2 + 5) + '" y="-6" width="12" height="12" rx="2.5" fill="' + ICON[k] + '"/>' +
        '<text x="' + (-w / 2 + 22) + '" y="3.8">' + l[0] + '</text><text class="v" x="' + (w / 2 - 6) + '" y="3.6" text-anchor="end">' + l[1] + '</text></g>';
    }
    function place(m, p) {
      var pt = m.path.getPointAtLength(m.len * p), dy = 0, op = 1;
      if (p < 0.05) op = p / 0.05;
      if (m.kind === 'in' && p > 0.93) op = Math.max(0, (1 - p) / 0.07);
      if (m.kind === 'out' && p < 0.06) op = p / 0.06;
      if (m.kind === 'out' && p > 0.9) { var q = (p - 0.9) / 0.1; dy = q * 16; op = 1 - q; }
      m.el.setAttribute('transform', 'translate(' + pt.x.toFixed(1) + ',' + (pt.y + dy).toFixed(1) + ')');
      m.el.style.opacity = op.toFixed(2);
    }
    function add(kind, path, html, speed, onEnd, startP) {
      var el = grp(html); layer.appendChild(el);
      var len = path.getTotalLength();
      var m = { kind: kind, el: el, path: path, len: len, dur: len / speed, t0: performance.now() - (startP || 0) * (len / speed), onEnd: onEnd };
      movers.push(m); place(m, startP || 0); return m;
    }
    function chatter() {
      var picks = pawns.slice().sort(function () { return Math.random() - 0.5; }).slice(0, 6 + Math.floor(Math.random() * 4));
      picks.forEach(function (s, i) {
        setTimeout(function () {
          s.querySelector('text').textContent = SAYS[Math.floor(Math.random() * SAYS.length)];
          s.classList.add('on');
          setTimeout(function () { s.classList.remove('on'); }, 1300);
        }, i * 180);
      });
    }
    function updateScreen() {
      var d = SCREENS[scrN++ % SCREENS.length];
      document.getElementById('scr-a').setAttribute('width', (96 * d.a / 100).toFixed(1));
      document.getElementById('scr-b').setAttribute('width', (96 * d.b / 100).toFixed(1));
      document.getElementById('scr-ap').textContent = d.a + '%';
      document.getElementById('scr-bp').textContent = d.b + '%';
      document.getElementById('scr-who').textContent = d.who;
      document.getElementById('scr-why').textContent = d.why;
    }
    function spawnOut(startP) {
      var k = ['A', 'B', 'C'][outN++ % 3];
      add('out', outs[k], T.outShapes[k] + chip(k), 0.075, updateScreen, startP);
    }
    function spawnIn(startP) {
      var key = IN_KEYS[inN++ % IN_KEYS.length];
      add('in', rIn, T.inTpl[key], 0.085, function () { chatter(); setTimeout(function () { spawnOut(); }, 650); }, startP);
    }
    function frame(now) {
      raf = null;
      for (var i = movers.length - 1; i >= 0; i--) {
        var m = movers[i], p = (now - m.t0) / m.dur;
        if (p >= 1) { m.el.remove(); movers.splice(i, 1); if (m.onEnd) m.onEnd(); continue; }
        place(m, p);
      }
      if (visible && !document.hidden) raf = requestAnimationFrame(frame);
    }
    function start() {
      if (timer) return;
      timer = setInterval(function () { if (visible && !document.hidden) spawnIn(); }, 2300);
      if (!raf) raf = requestAnimationFrame(frame);
    }
    function stop() { clearInterval(timer); timer = null; }

    // Seed the scene so it never starts empty.
    [0.12, 0.42, 0.72].forEach(function (p) { spawnIn(p); });
    spawnOut(0.35); spawnOut(0.7);
    if (reduce) {
      movers.forEach(function (m) { if (m.kind === 'out') m.el.style.opacity = 1; });
      pawns.slice(0, 2).forEach(function (s, i) { s.querySelector('text').textContent = ['A', 'lol'][i]; s.classList.add('on'); });
      return;
    }
    var paused = false;
    function pause() { if (paused) return; paused = true; var now = performance.now(); movers.forEach(function (m) { m.pause = (now - m.t0) / m.dur; }); stop(); }
    function resume() {
      if (!paused || !visible || document.hidden) return; paused = false;
      var now = performance.now(); movers.forEach(function (m) { if (m.pause != null) m.t0 = now - m.pause * m.dur; m.pause = null; });
      start();
    }
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (es) {
        visible = es[0].isIntersecting;
        if (visible) resume(); else pause();
      }).observe(svg);
    }
    document.addEventListener('visibilitychange', function () { if (document.hidden) pause(); else resume(); });
    start();
  })();
</script>
